<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - UCSC Place Finder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="hero" style="padding: 40px 0;">
        <div class="container hero-content">
            <div class="hero-text">
                <h1>Admin Dashboard</h1>
                <p>Manage campus locations and information.</p>
            </div>
        </div>
    </header>

    <main class="container admin-container">
        <div id="loginSection">
            <div class="login-card">
                <img src="logo.jpg" alt="Logo" style="width: 80px; margin-bottom: 24px;">
                <h2>Admin Login</h2>
                <p style="margin-bottom: 32px; opacity: 0.7;">Sign in to access the dashboard.</p>
                <form id="adminLoginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-full">Login</button>
                </form>
                <p id="loginError" style="color: #ef4444; margin-top: 16px; display: none;"></p>
            </div>
        </div>

        <div id="adminContent">
            <div class="dashboard-header">
                <h2>Manage Locations</h2>
                <div class="dashboard-actions">
                    <button id="seedBtn" class="btn" style="display: none; background: #8b5cf6; color: white;">Seed Data from JSON</button>
                    <button id="addBtn" class="btn btn-primary">Add New Location</button>
                    <button id="logoutBtn" class="btn">Logout</button>
                </div>
            </div>

            <div id="placesList">
                <!-- Places will be loaded here -->
                <div class="loading">Loading locations...</div>
            </div>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div id="placeModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-scrollable">
                <h2 id="modalTitle" style="margin-bottom: 24px;">Add New Location</h2>
                <form id="placeForm">
                    <input type="hidden" id="placeId">
                    <div class="form-group">
                        <label for="name">Location Name</label>
                        <input type="text" id="name" required placeholder="e.g., Lab A">
                    </div>
                    <div class="form-group">
                        <label for="building">Building</label>
                        <input type="text" id="building" required placeholder="e.g., Main Building">
                    </div>
                    <div class="form-group">
                        <label for="floor">Floor</label>
                        <input type="text" id="floor" required placeholder="e.g., 1st Floor">
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="Lab">Lab</option>
                            <option value="Office">Office</option>
                            <option value="Lecture Hall">Lecture Hall</option>
                            <option value="Library">Library</option>
                            <option value="Canteen">Canteen</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" rows="3" required placeholder="Briefly describe the place..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="directions">Directions</label>
                        <textarea id="directions" rows="3" required placeholder="How to get there?"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="imageFile">Location Photo</label>
                        <input type="file" id="imageFile" accept="image/*">
                        <input type="hidden" id="imageUrl">
                        <div id="imagePreview" class="image-preview-container">
                            <img src="" alt="Preview">
                            <div style="display: flex; flex-direction: column; gap: 4px;">
                                <span class="preview-label">Current Photo</span>
                                <button type="button" id="removeImageBtn" class="btn btn-sm btn-danger" style="padding: 4px 8px; border-radius: 6px;">Remove</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="floorPlanFile">Floor Plan</label>
                        <input type="file" id="floorPlanFile" accept="image/*">
                        <input type="hidden" id="floorPlanUrl">
                        <div id="floorPlanPreview" class="image-preview-container">
                            <img src="" alt="Preview">
                            <div style="display: flex; flex-direction: column; gap: 4px;">
                                <span class="preview-label">Current Floor Plan</span>
                                <button type="button" id="removeFloorPlanBtn" class="btn btn-sm btn-danger" style="padding: 4px 8px; border-radius: 6px;">Remove</button>
                            </div>
                        </div>
                    </div>
                    <div class="actions" style="justify-content: flex-end; margin-top: 32px;">
                        <button type="button" id="cancelBtn" class="btn">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Location</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
